baseurl = "https://antweiss.com/"
languageCode = "en-us"
title = "Ant Weiss"
theme = "cocoa-eh"

pygmentsstyle = "lovelace"
disableKinds = ["taxonomy"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
fixed = ":title/"
blog = "blog/:slug/"

[params]
dateform = "Jan 2, 2006"
dateformfull = "Mon Jan 2 2006 15:04:05 MST"
author = "Ant Weiss"
description = "Coaching engineering leaders through AI transformation"
email = "anton@otomato.io"
faviconfile = "img/otomato.ico"
gitHub = "//github.com/antweiss"
lang = "en"
linkedIn = "//linkedin.com/in/antonweiss"
twitter = "//twitter.com/antweiss"
logofile = "https://avatars2.githubusercontent.com/u/3274734?s=40&v=4"
usesmallsummarycard = true
posts_navigation = true
highlightjs = true
share = true

[[menu.main]]
  name = "Coaching"
  url = "/coaching/"
  weight = 1

[[menu.main]]
  name = "Signals"
  url = "/signals/"
  weight = 2

[[menu.main]]
  name = "Insights"
  url = "/insights/"
  weight = 3

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 4

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 5

[params.utteranc]
enable = true
repo = "mtn/cocoa-eh-hugo-theme"
issueTerm = "title"

[params.colors]
identifier = "#527fc1f"
identifier_dark = "#1a3152"
trivial = "#6a7a8b"
foreground = "#181d2a"
background = "#f9f9f9"
background_dark = "#282a36"
code = "#87a5d2"
type = "#97d28b"
special = "#ffcb8d"
value = "#96c2d7"
statement = "#ff8e91"
