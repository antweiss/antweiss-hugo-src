<header class="site-header">
  <div class="container">
    <a href="{{ "/" | relURL }}" class="brand"><img src="{{ "/img/logo.svg" | relURL }}" alt="{{ .Site.Title }}" class="site-logo"></a>
    <nav class="nav">
      {{ range .Site.Menus.main }}
        {{ $active := eq $.RelPermalink (.URL | relURL) }}
        <a href="{{ .URL | relURL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a href="{{ .Site.Params.bookurl | default "/coaching/" | relURL }}" class="btn">Book a call</a>
    </nav>
  </div>
</header>
