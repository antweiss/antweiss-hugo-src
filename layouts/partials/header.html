<header class="site-header">
  <div class="container">
    <a href="{{ "/" | relURL }}" class="brand">{{ .Site.Title }} <span class="dot"></span></a>
    <nav class="nav">
      {{ range .Site.Menus.main }}
        {{ $active := eq $.RelPermalink (.URL | relURL) }}
        <a href="{{ .URL | relURL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a href="{{ .Site.Params.bookurl | default "/coaching/" | relURL }}" class="btn">Book a call</a>
    </nav>
  </div>
</header>
